name: Build and publish Jayln3 blog

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jayln3-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check article metadata
        run: npm test
      - name: Build and validate Chinese and English
        run: npm run build
      - name: Install browser for functional tests
        run: npx playwright install --with-deps chromium
      - name: Check navigation and search on desktop and mobile
        run: npm run test:browser
      - name: Publish and wait for GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/publish.mjs
